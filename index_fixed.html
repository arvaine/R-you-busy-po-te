    .card {
      width: min(90%, 520px);
      padding: 38px 28px;
      text-align: center;
      color: white;
      background: rgba(15, 15, 20, .72);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 1.1;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .choice-button {
      width: 100%;
      text-align: left;
      border-radius: 14px;
      background: rgba(255,255,255,.12);
      color: white;
      border: 1px solid rgba(255,255,255,.25);
    }

    .choice-button:hover { background: rgba(255,255,255,.2); }

    .choice-button.selected {
      background: rgba(255,255,255,.28);
      border-color: white;
    }

    #custom-answer {
      display: none;
      width: 100%;
      padding: 13px 16px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 14px;
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 1rem;
      outline: none;
    }

    #custom-answer::placeholder { color: rgba(255,255,255,.65); }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 25px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: .9;
    }

    #yes { background: white; color: #222; }
    #no { background: rgba(255,255,255,.15); color: white; border: 1px solid rgba(255,255,255,.35); }

    #answer {
      margin: 22px 0 0;
      min-height: 24px;
      font-size: 1.1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <section id="name-screen">
      <h1>What's your name?</h1>
      <input id="name" type="text" placeholder="Enter your name..." maxlength="40" autocomplete="name"
        style="width:100%;padding:14px 18px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(255,255,255,.12);color:white;font-size:1rem;outline:none;margin-bottom:14px;">
      <button id="continue" style="background:white;color:#222;">Continue →</button>
      <p id="name-error" style="margin:14px 0 0;min-height:20px;font-size:.95rem;"></p>
    </section>

    <section id="question-screen" style="display:none;">
      <h1>Are you busy po?</h1>
      <div class="buttons">
        <button class="choice-button" data-letter="A" data-choice="Yes po busy ako">A. Yes po busy ako</button>
        <button class="choice-button" data-letter="B" data-choice="No po di ako busy hehe">B. No po di ako busy hehe</button>
        <button class="choice-button" data-letter="C" data-choice="diko alam">C. diko alam</button>
        <button class="choice-button" data-letter="D" data-choice="sikret">D. sikret</button>
        <button class="choice-button" id="custom-choice" data-letter="E" data-choice="letzguh">E. <span id="custom-label">letzguh</span></button>
        <button class="choice-button" data-letter="F" data-choice="Type your own answer">F. Type your own answer</button>
        <input id="custom-answer" type="text" maxlength="200" placeholder="Type your own answer...">
      </div>
      <button id="submit-answer" style="margin-top:18px;background:white;color:#222;">Submit</button>
      <p id="answer"></p>
    </section>
  </main>

  <script>
    const DISCORD_ENDPOINT = "https://script.google.com/macros/s/AKfycbwsGyvDFFk2f3fskBUrnCJZfzGOnMrwLrtuHSBvq2pJVhvWj6cbo9yrI2jVSQzhxdc/exec";
    const nameScreen = document.getElementById("name-screen");
    const questionScreen = document.getElementById("question-screen");
    const nameInput = document.getElementById("name");
    const nameError = document.getElementById("name-error");
    const answer = document.getElementById("answer");
    const customChoice = document.getElementById("custom-choice");
    const customAnswer = document.getElementById("custom-answer");
    const submitAnswer = document.getElementById("submit-answer");

    let visitorName = "";
    let selectedLetter = "";
    let selectedChoice = "";

    document.getElementById("continue").onclick = () => {
      const name = nameInput.value.trim();

      if (!name) {
        nameError.textContent = "Please enter your name po hehe";
        nameInput.focus();
        return;
      }

      visitorName = name;
      nameError.textContent = "";
      nameScreen.style.display = "none";
      questionScreen.style.display = "block";
    };

    nameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        document.getElementById("continue").click();
      }
    });

    function selectButton(button) {
      document.querySelectorAll(".choice-button").forEach((b) => {
        b.style.background = "rgba(255,255,255,.12)";
        b.style.borderColor = "rgba(255,255,255,.25)";
      });

      button.style.background = "rgba(255,255,255,.28)";
      button.style.borderColor = "white";

      selectedLetter = button.dataset.letter;
      selectedChoice = button.dataset.choice || "";

      if (selectedLetter === "E") {
        customAnswer.style.display = "block";
        customAnswer.focus();
        answer.textContent = "";
      } else {
        customAnswer.style.display = "none";
        answer.textContent = "";
      }
    }

    document.querySelectorAll(".choice-button").forEach((button) => {
      button.onclick = () => selectButton(button);
    });

    function sendChoice(letter, choice) {
      fetch(DISCORD_ENDPOINT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify({
          name: visitorName,
          letter: letter,
          choice: choice
        })
      }).catch(() => {});
    }

    submitAnswer.onclick = () => {
      if (!selectedLetter) {
        answer.textContent = "Please select an answer first po ";
        return;
      }

      if (selectedLetter === "E") {
        const text = customAnswer.value.trim();

        if (!text) {
          answer.textContent = "Please type your own answer po ";
          customAnswer.focus();
          return;
        }

        sendChoice("E", text);
        answer.textContent = "Sent poooo";
      } else {
        sendChoice(selectedLetter, selectedChoice);
        answer.textContent = "Sent poooo";
      }

      submitAnswer.disabled = true;
      setTimeout(() => {
        submitAnswer.disabled = false;
      }, 1500);
    };

    customAnswer.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        submitAnswer.click();
      }
    });
  </script>
</body>
</html>
